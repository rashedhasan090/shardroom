[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "shardroom"
version = "0.1.0"
description = "Open or join a Shardroom kiln from the command line."
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Md Rashedul Hasan" }]
dependencies = []

[project.scripts]
shardroom = "shardroom.cli:main"

[project.urls]
Homepage = "https://shardroom.mdrashedulhasan.me"

[tool.setuptools.packages.find]
where = ["src"]
